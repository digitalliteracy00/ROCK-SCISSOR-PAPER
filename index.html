<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI와 가위바위보 대결</title>
<style>
  :root{
    --bg: #EFF5FF;
    --bg-deep: #DCE9FF;
    --ink: #1B2A4A;
    --ink-soft: #4A5A7A;
    --scissors: #F982A4;
    --scissors-deep: #C2657F;
    --rock: #FED122;
    --rock-deep: #C6A31A;
    --paper: #62C3FD;
    --paper-deep: #4C98C5;
    --ai: #7C5CFC;
    --ai-deep: #5E3FE0;
    --win: #2FB86E;
    --tie: #8A97B3;
    --lose: #F25C5C;
    --card-bg: #FFFFFF;
  }

  * { box-sizing: border-box; }

  html { font-size: 18px; }

  body{
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 12% 8%, var(--bg-deep), transparent 45%),
      radial-gradient(circle at 88% 92%, #FFE9CC, transparent 40%),
      var(--bg);
    font-family: 'HancomMalangMalang', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .app{
    width: 100%;
    max-width: 720px;
    padding: 1.2rem 1.2rem 2rem;
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
  }

  /* ---------- Header ---------- */
  .topbar{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .8rem;
  }
  .topbar h1{
    font-size: 1.7rem;
    line-height: 1.3;
    margin: 0;
    font-weight: 800;
  }
  .reset-btn{
    flex: 0 0 auto;
    width: 3.1rem;
    height: 3.1rem;
    border-radius: 50%;
    border: none;
    background: var(--card-bg);
    box-shadow: 0 3px 0 rgba(27,42,74,.12);
    font-size: 1.5rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .15s ease;
  }
  .reset-btn:active{ transform: scale(.9) rotate(-25deg); }

  /* ---------- Training data panel (top right) ---------- */
  .data-panel{
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: .5rem;
    flex-wrap: wrap;
  }
  .data-panel-label{
    font-size: .95rem;
    font-weight: 700;
    color: var(--ink-soft);
    margin-right: .1rem;
  }
  .data-chip{
    display: flex;
    align-items: center;
    gap: .3rem;
    background: var(--card-bg);
    border-radius: 999px;
    padding: .3rem .7rem .3rem .4rem;
    box-shadow: 0 3px 0 rgba(27,42,74,.08);
  }
  .data-chip.gawi{ box-shadow: 0 3px 0 rgba(27,42,74,.08), inset 0 0 0 2px var(--scissors); }
  .data-chip.bawi{ box-shadow: 0 3px 0 rgba(27,42,74,.08), inset 0 0 0 2px var(--rock); }
  .data-chip.bo  { box-shadow: 0 3px 0 rgba(27,42,74,.08), inset 0 0 0 2px var(--paper); }
  .data-chip img{ height: 1.5rem; width: auto; object-fit: contain; }
  .data-chip .count{ font-size: 1.15rem; font-weight: 800; }
  .data-chip .unit{ font-size: .85rem; font-weight: 700; color: var(--ink-soft); margin-left: -.15rem; }

  .caption{
    font-size: 1.15rem;
    color: var(--ink-soft);
    line-height: 1.5;
    margin: 0;
  }

  /* ---------- Arena ---------- */
  .arena{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .8rem;
  }
  .card{
    flex: 1;
    background: var(--card-bg);
    border-radius: 26px;
    padding: 1.1rem .6rem 1.3rem;
    text-align: center;
    box-shadow: 0 6px 0 rgba(27,42,74,.08);
    min-height: 10.5rem;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: .4rem;
  }
  .card-label{
    font-size: 1.05rem;
    font-weight: 800;
    color: var(--ink-soft);
  }
  .card-emoji{
    font-size: 3.6rem;
    line-height: 1;
    transition: transform .25s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 5.4rem;
  }
  .card-emoji img{ height: 5.4rem; width: auto; object-fit: contain; }
  .card.reveal .card-emoji{ animation: pop .45s ease; }
  @keyframes pop{
    0%{ transform: scale(.3) rotate(-15deg); }
    60%{ transform: scale(1.25) rotate(8deg); }
    100%{ transform: scale(1) rotate(0); }
  }
  .card.shaking .card-emoji{ animation: shake .5s ease infinite; }
  @keyframes shake{
    0%,100%{ transform: translateY(0) rotate(0); }
    25%{ transform: translateY(-4px) rotate(-8deg); }
    75%{ transform: translateY(-4px) rotate(8deg); }
  }
  .vs{
    font-size: 1.3rem;
    font-weight: 800;
    color: var(--ai-deep);
    flex: 0 0 auto;
  }
  .ai-card{ border: 3px solid #EDE7FF; }
  .student-card{ border: 3px solid #FFEBDE; }

  /* ---------- Result ---------- */
  .result-banner{
    min-height: 3.6rem;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 1.7rem;
    font-weight: 800;
    color: var(--ink-soft);
    background: #E9EEF9;
    padding: .5rem 1rem;
    transition: all .25s ease;
  }
  .result-banner.win{ background: #E1F7EA; color: var(--win); }
  .result-banner.tie{ background: #ECEEF4; color: var(--tie); }
  .result-banner.lose{ background: #FDEAEA; color: var(--lose); }

  /* ---------- Scoreboard (AI vs 나) ---------- */
  .scoreboard{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.4rem;
    background: var(--card-bg);
    border-radius: 20px;
    padding: 1rem .8rem;
    box-shadow: 0 4px 0 rgba(27,42,74,.06);
  }
  .vs-side{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: .2rem;
    flex: 1;
  }
  .vs-label{
    font-size: 1.15rem;
    font-weight: 800;
    color: var(--ink-soft);
  }
  .vs-num{
    font-size: 2.6rem;
    font-weight: 900;
    line-height: 1;
  }
  .vs-side.ai .vs-num{ color: var(--ai-deep); }
  .vs-side.me .vs-num{ color: var(--ink); }
  .vs-colon{
    font-size: 2rem;
    font-weight: 900;
    color: var(--ink-soft);
    flex: 0 0 auto;
  }

  /* ---------- Choices ---------- */
  .choices{
    display: flex;
    justify-content: center;
    gap: 1rem;
  }
  .choice-btn{
    flex: 1;
    max-width: 9.5rem;
    aspect-ratio: 1 / 1;
    border-radius: 32% 68% 61% 39% / 46% 36% 64% 54%;
    border: none;
    color: #513A0A;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .1rem;
    cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,.15);
    transition: transform .12s ease, box-shadow .12s ease;
    padding: .3rem;
  }
  .choice-btn .emo{ height: 3.1rem; display: flex; align-items: center; justify-content: center; }
  .choice-btn .emo img{ height: 100%; width: auto; object-fit: contain; filter: drop-shadow(0 2px 0 rgba(0,0,0,.08)); }
  .choice-btn span.label{ font-size: 1.25rem; font-weight: 800; }
  .choice-btn:active{ transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.15); }
  .choice-btn:disabled{ opacity: .45; cursor: not-allowed; transform: none; }
  .choice-btn.scissors{ background: linear-gradient(160deg, var(--scissors), var(--scissors-deep)); color: #4A1224; }
  .choice-btn.rock{ background: linear-gradient(160deg, var(--rock), var(--rock-deep)); color: #513A0A; }
  .choice-btn.paper{ background: linear-gradient(160deg, var(--paper), var(--paper-deep)); color: #17324A; }

  /* ---------- Overlay ---------- */
  .overlay{
    position: fixed;
    inset: 0;
    background: rgba(27,42,74,.55);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1.2rem;
    z-index: 10;
  }
  .overlay.show{ display: flex; }
  .overlay-card{
    background: #fff;
    border-radius: 28px;
    padding: 2rem 1.6rem;
    text-align: center;
    max-width: 26rem;
    width: 100%;
    box-shadow: 0 12px 0 rgba(0,0,0,.12);
    animation: popIn .35s ease;
  }
  @keyframes popIn{
    0%{ transform: scale(.7); opacity: 0; }
    100%{ transform: scale(1); opacity: 1; }
  }
  .overlay-emoji{ font-size: 3.6rem; margin-bottom: .3rem; }
  .overlay-card h2{ font-size: 1.6rem; margin: .2rem 0 .6rem; }
  .overlay-card p{ font-size: 1.2rem; color: var(--ink-soft); line-height: 1.55; margin: 0 0 1.3rem; }
  .overlay-btn{
    border: none;
    background: linear-gradient(160deg, var(--ai), var(--ai-deep));
    color: #fff;
    font-size: 1.25rem;
    font-weight: 800;
    padding: .9rem 1.8rem;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,.15);
  }
  .overlay-btn{ touch-action: manipulation; }
  .overlay-btn:active{ transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.15); }

  .choice-btn, .reset-btn{ touch-action: manipulation; }
  .choice-btn{ min-width: 4rem; }

  /* ---------- Small / narrow screens (phones) ---------- */
  @media (max-width: 480px){
    .app{ gap: .8rem; padding: 1rem .9rem 1.6rem; }
    .topbar h1{ font-size: 1.4rem; }
    .data-panel-label{ display: none; }
    .card{ min-height: 8.3rem; padding: .8rem .5rem 1rem; }
    .scoreboard{ padding: .6rem; gap: 1.2rem; }
  }
  @media (max-width: 380px){
    .choice-btn .emo{ height: 2.5rem; }
    .card-emoji, .card-emoji img{ height: 4.2rem; }
  }
</style>
</head>

  function iconHtml(move){
    return '<img src="' + ICON[move] + '" alt="' + move + '">';
  }

  // 학습 데이터 카운트 (학생이 낸 수를 AI가 "관찰"하며 쌓이는 데이터)
  let dataCounts = { '가위': 0, '바위': 0, '보': 0 };

  function initDataPanelIcons(){
    el('chipIconGawi').src = ICON['가위'];
    el('chipIconBawi').src = ICON['바위'];
    el('chipIconBo').src = ICON['보'];
  }

  function recordData(move){
    dataCounts[move]++;
    el('countGawi').textContent = dataCounts['가위'];
    el('countBawi').textContent = dataCounts['바위'];
    el('countBo').textContent = dataCounts['보'];
  }

  function totalData(){
    return dataCounts['가위'] + dataCounts['바위'] + dataCounts['보'];
  }

  // 학습 단계별 안내 문구
  const STAGE_INFO = {
    1: { label: '가위 학습중', doneTitle: '🎉 가위 학습 완료!',
         doneText: '이제부터 AI가 바위도 함께 낼 수 있어요!' },
    2: { label: '바위 학습중', doneTitle: '🎉 바위 학습 완료!',
         doneText: '이제부터 AI가 보까지 배워서 모두 낼 수 있어요!' },
    3: { label: '보 학습중', doneTitle: '🏆 보 학습 완료!',
         doneText: 'AI가 가위, 바위, 보를 모두 배웠어요. 이제 실전 대결을 시작해요!' }
  };

  // 각 단계가 "시작"될 때 보여줄 안내 팝업 (시작하기 버튼으로 진행)
  const STAGE_START_INFO = {
    1: { emoji: '✌️', title: '1단계', text: '가위를 학습시키세요!' },
    2: { emoji: '✊', title: '2단계', text: '바위를 학습시키세요!' },
    3: { emoji: '🖐️', title: '3단계', text: '보를 학습시키세요!' },
    4: { emoji: '🏆', title: '실전 대결을 시작해요!',
         text: '이제부터 실전이에요! 대결할수록 AI가 점점 강해져요.' }
  };

  const CAPTIONS = {
    1: 'AI는 지금 가위만 낼 수 있어요!',
    2: 'AI는 이제 가위와 바위 중 하나를 낼 수 있어요!',
    3: 'AI는 이제 가위, 바위, 보를 모두 자유롭게 낼 수 있어요!',
    4: '🏆 실전 대결! 할수록 AI가 강해져요.'
  };

  // 상대가 이 수를 내면 지는 수 (학생이 이기도록 만들 때 사용)
  const LOSES_TO = { '가위': '보', '바위': '가위', '보': '바위' };
  // 상대가 이 수를 내면 이기는 수
  const BEATS    = { '가위': '바위', '바위': '보', '보': '가위' };
  // 학습 단계(1~3)에서 AI가 그동안 배워서 낼 수 있는 수의 목록 (누적으로 늘어남)
  const STAGE_AI_POOL = {
    1: ['가위'],
    2: ['가위', '바위'],
    3: ['가위', '바위', '보']
  };
  // 1~3단계는 우측 상단 "학습 데이터"에 실제로 쌓인 개수로 다음 단계 진행을 판단함
  const STAGE_TARGET_MOVE = { 1: '가위', 2: '바위', 3: '보' };

  let state = {
    stage: 1,          // 1,2,3 = 학습 단계, 4 = 실전 모드
    stage4Rounds: 0,    // 4단계(실전)에서 진행한 라운드 수 — AI 승률(%) 계산에 사용
    win: 0, tie: 0, lose: 0,
    totalRounds: 0,
    locked: false
  };

  const el = id => document.getElementById(id);
  const aiEmoji = el('aiEmoji'), studentEmoji = el('studentEmoji');
  const aiCard = el('aiCard'), studentCard = el('studentCard');
  const resultBanner = el('resultBanner');
  const caption = el('caption');
  const overlay = el('stageOverlay');

  function judge(student, ai){
    if (student === ai) return 'tie';
    return BEATS[ai] === student ? 'win' : 'lose';
  }

  // 지금까지 쌓인 학습 데이터 총 개수를 AI 승률(%)로 변환 (데이터 30개 = AI 승률 30%)
  function currentAiWinPct(){
    return Math.min(state.stage4Rounds, AI_WIN_MAX);
  }

  function pickAiMove(student){
    if (state.stage < 4){
      // 학습 단계: AI는 이 단계까지 배운 수들 중에서만 무작위로 냄 (누적)
      const pool = STAGE_AI_POOL[state.stage];
      return pool[Math.floor(Math.random() * pool.length)];
    }
    // 실전 모드: AI 승률(%) = 지금까지의 실전 라운드 수 (최대 100). 나머지는 학생 승
    const aiWinRate = currentAiWinPct() / 100;
    const r = Math.random();
    return (r < aiWinRate) ? BEATS[student] : LOSES_TO[student];
  }

  // 1~3단계는 AI가 무엇을 낼지 예측하며 학생이 세 버튼을 자유롭게 사용
  function updateEnabledChoices(){
    if (state.locked) return; // 라운드 진행 중에는 건드리지 않음
    setChoicesDisabled(false);
  }

  function updateProgress(){
    refreshCaption();
  }

  function refreshCaption(){
    if (state.stage <= 3){
      const target = STAGE_TARGET_MOVE[state.stage];
      const shown = Math.min(dataCounts[target], STAGE_COMPLETE_THRESHOLD);
      caption.textContent = CAPTIONS[state.stage] +
        ' (' + target + ' ' + shown + '/' + STAGE_COMPLETE_THRESHOLD + '번)';
    } else {
      caption.textContent = CAPTIONS[4] + ' (실전 데이터 ' + state.stage4Rounds + '개 → AI 승률 ' + currentAiWinPct() + '%)';
    }
  }

  function updateScoreboard(){
    el('aiScoreNum').textContent = state.lose;
    el('myScoreNum').textContent = state.win;
  }

  function setChoicesDisabled(disabled){
    document.querySelectorAll('.choice-btn').forEach(b => b.disabled = disabled);
  }

  function playRound(student){
    if (state.locked) return;
    state.locked = true;
    setChoicesDisabled(true);

    // 둘 다 숨긴 채로 함께 흔들리며 "가위바위보!" 구호에 맞춰 동시에 낼 준비
    studentEmoji.textContent = '❓';
    aiEmoji.textContent = '❓';
    resultBanner.className = 'result-banner';
    aiCard.classList.add('shaking');
    studentCard.classList.add('shaking');
    recordData(student);

    const beat = REVEAL_DELAY_MS / 3;
    resultBanner.textContent = '가위!';
    setTimeout(() => { resultBanner.textContent = '바위!'; }, beat);
    setTimeout(() => { resultBanner.textContent = '보!'; }, beat * 2);

    setTimeout(() => {
      aiCard.classList.remove('shaking');
      studentCard.classList.remove('shaking');

      // 학생과 AI가 정확히 같은 순간에 동시 공개
      const aiMove = pickAiMove(student);
      aiEmoji.innerHTML = iconHtml(aiMove);
      studentEmoji.innerHTML = iconHtml(student);
      aiCard.classList.add('reveal');
      studentCard.classList.add('reveal');

      const result = judge(student, aiMove);
      showResult(result);
      refreshCaption();

      setTimeout(() => {
        aiCard.classList.remove('reveal');
        studentCard.classList.remove('reveal');
      }, 450);

      advanceState(student);
    }, REVEAL_DELAY_MS);
  }

  function showResult(result){
    state.totalRounds++;
    if (result === 'win'){
      state.win++;
      resultBanner.className = 'result-banner win';
      resultBanner.textContent = '내가 이겼어요!';
    } else if (result === 'tie'){
      state.tie++;
      resultBanner.className = 'result-banner tie';
      resultBanner.textContent = '비겼어요!';
    } else {
      state.lose++;
      resultBanner.className = 'result-banner lose';
      resultBanner.textContent = '내가 졌어요!';
    }
    updateScoreboard();
  }

  function advanceState(student){
    if (state.stage <= 3){
      // 1~3단계: 우측 상단 "학습 데이터"에 실제로 쌓인 목표 수의 개수로 판단
      updateProgress();
      if (dataCounts[STAGE_TARGET_MOVE[state.stage]] >= STAGE_COMPLETE_THRESHOLD){
        setTimeout(() => openStageOverlay(state.stage), 550);
        return;
      }
    } else {
      // 4단계(실전): 라운드마다 실전 데이터가 쌓여 AI 승률이 올라감
      state.stage4Rounds++;
      updateProgress();
    }
    setTimeout(() => {
      state.locked = false;
      updateEnabledChoices();
    }, 550);
  }

  function openStageOverlay(finishedStage){
    const info = STAGE_INFO[finishedStage];
    el('overlayEmoji').textContent = finishedStage === 3 ? '🏆' : '🎉';
    el('overlayTitle').textContent = info.doneTitle;
    el('overlayText').textContent = info.doneText;
    el('overlayBtn').textContent = '확인';
    overlay.dataset.mode = 'complete';
    overlay.dataset.finishedStage = finishedStage;
    overlay.classList.add('show');
  }

  function showStartPopup(stageNum){
    const info = STAGE_START_INFO[stageNum];
    el('overlayEmoji').textContent = info.emoji;
    el('overlayTitle').textContent = info.title;
    el('overlayText').textContent = info.text;
    el('overlayBtn').textContent = '시작하기';
    overlay.dataset.mode = 'start';
    overlay.dataset.targetStage = stageNum;
    overlay.classList.add('show');
  }

  function enterStage(newStage){
    state.stage = newStage;
    if (newStage === 4) state.stage4Rounds = 0;
    updateProgress();
    state.locked = false;
    updateEnabledChoices();
    resultBanner.className = 'result-banner';
    resultBanner.textContent = newStage === 4
      ? '이제부터 진짜 실력 대결이에요. 준비됐나요?'
      : '가위, 바위, 보 중 하나를 내보세요!';
  }

  el('overlayBtn').addEventListener('click', () => {
    const mode = overlay.dataset.mode;
    overlay.classList.remove('show');

    if (mode === 'complete'){
      // 1~3단계 완료 → 다음 단계 "시작하기" 안내 팝업을 먼저 보여줌
      const finished = Number(overlay.dataset.finishedStage);
      showStartPopup(finished + 1);
    } else {
      // 시작 안내 팝업의 "시작하기" 버튼
      enterStage(Number(overlay.dataset.targetStage));
    }
  });

  document.querySelectorAll('.choice-btn').forEach(btn => {
    btn.addEventListener('click', () => playRound(btn.dataset.move));
  });

  el('resetBtn').addEventListener('click', () => {
    state = { stage: 1, stage4Rounds: 0, win: 0, tie: 0, lose: 0, totalRounds: 0, locked: false };
    dataCounts = { '가위': 0, '바위': 0, '보': 0 };
    el('countGawi').textContent = 0;
    el('countBawi').textContent = 0;
    el('countBo').textContent = 0;
    aiEmoji.textContent = '❓';
    studentEmoji.textContent = '❓';
    resultBanner.className = 'result-banner';
    resultBanner.textContent = '가위, 바위, 보 중 하나를 내보세요!';
    updateProgress();
    updateScoreboard();
    updateEnabledChoices();
    showStartPopup(1);
  });

  initDataPanelIcons();
  updateProgress();
  updateScoreboard();
  updateEnabledChoices();
  showStartPopup(1);
</script>
</body>
</html>
